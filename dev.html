<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <meta name="description" content="ASTRO LAB — train as an astronaut, then land on the Moon.">
  <title>ASTRO LAB</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/career.css">
</head>
<body>
  <noscript><div class="noscript">ASTRO LAB needs JavaScript enabled to run.</div></noscript>

  <!-- 3D view lives here (behind all screens) -->
  <div id="scene-root" aria-hidden="false"></div>

  <!-- 1. Loading -->
  <section id="screen-loading" class="screen active" aria-label="Loading">
    <div class="logo-wrap">
      <div class="logo-orbit"><span class="logo-planet"></span></div>
      <h1 class="logo">ASTRO<span>LAB</span></h1>
    </div>
    <div class="load-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="load-fill"></i></div>
    <p id="load-text" class="muted">Preparing the Moon…</p>
  </section>

  <!-- 2. Main menu -->
  <section id="screen-menu" class="screen" aria-label="Main menu">
    <canvas id="menu-particles" aria-hidden="true"></canvas>
    <div class="menu-card glass">
      <h1 class="logo small">ASTRO<span>LAB</span></h1>
      <p class="tagline">From your bedroom to the Moon. Train as an astronaut, then land on the lunar surface.</p>
      <nav class="menu-buttons" aria-label="Main menu">
        <button class="btn primary big" data-action="newgame">▶ New Game</button>
        <button class="btn big" data-action="resume" id="btn-resume" hidden>⟳ Resume Game</button>
        <button class="btn big" data-action="training">🎓 Training Modules</button>
        <button class="btn big" data-action="lunar">🌕 Lunar Mission</button>
        <div class="menu-row">
          <button class="btn" data-action="achievements">🏆 Achievements</button>
          <button class="btn" data-action="settings">⚙ Settings</button>
          <button class="btn" data-action="credits">✦ Credits</button>
          <button class="btn" data-action="quit">⏻ Quit</button>
        </div>
      </nav>
      <p class="muted tiny" id="menu-note"></p>
    </div>
  </section>

  <!-- Quit -->
  <section id="screen-quit" class="screen" aria-label="Game closed">
    <div class="menu-card glass">
      <h1 class="logo small">ASTRO<span>LAB</span></h1>
      <h2>Progress saved</h2>
      <p>It's safe to close this tab or window now.</p>
      <button class="btn primary" id="btn-unquit">← Back to the main menu</button>
    </div>
  </section>

  <!-- Full-screen game views -->
  <section id="screen-surface" class="screen surface-screen" aria-label="Lunar Mission"></section>
  <section id="screen-career" class="screen career-screen" aria-label="Astronaut career"></section>

  <!-- Modal layer -->
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="fatal" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
